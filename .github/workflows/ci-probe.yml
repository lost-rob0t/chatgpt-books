name: ci-probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reproduce books-ci with captured logs
        shell: bash
        run: |
          mkdir -p probe-logs
          run_step() {
            name="$1"; shift
            echo "=== STEP: $name"
            if "$@" > "probe-logs/$name.log" 2>&1; then
              echo "$name: OK"
            else
              echo "$name: FAILED (exit $?)"
            fi
          }
          run_step install bash -c 'set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y emacs-nox graphviz python3-matplotlib curl unzip default-jre-headless
            curl --fail --location --retry 3 --output pandoc.deb https://github.com/jgm/pandoc/releases/download/3.10.1/pandoc-3.10.1-1-amd64.deb
            sudo dpkg -i pandoc.deb
            curl --fail --location --retry 3 --output epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
            unzip -q epubcheck.zip -d .cache
            pandoc --version | head -1
            java -jar .cache/epubcheck-5.3.0/epubcheck.jar --version'
          run_step structure bash ./tools/check-structure
          run_step pandoc-reader python3 ./tools/check-pandoc-org-reader
          run_step fixture bash ./tools/build-fixture
          run_step epubcheck java -jar .cache/epubcheck-5.3.0/epubcheck.jar dist/bootstrap-fixture.epub
          run_step fixture-regression python3 ./tools/check-epub-fixture dist/bootstrap-fixture.epub
          run_step book-prolog bash -c 'make book BOOK=prolog && python3 ./tools/check-book-citations books/prolog/dist/prolog.epub swi-stable-download "SWI-Prolog stable downloads"'
          run_step org-roam-install bash -c 'emacs -Q --batch \
            --eval "(require (quote package))" \
            --eval "(setq package-user-dir (expand-file-name \".cache/elpa\" default-directory))" \
            --eval "(setq package-install-upgrade-built-in t)" \
            --eval "(setq package-archives ((\"gnu\" . \"https://elpa.gnu.org/packages/\") (\"nongnu\" . \"https://elpa.nongnu.org/nongnu/\") (\"melpa\" . \"https://melpa.org/packages/\")))" \
            --eval "(package-initialize)" \
            --eval "(package-refresh-contents)" \
            --eval "(package-install (quote org-roam))"'
          run_step ert bash -c 'emacs -Q --batch \
            --eval "(require (quote package))" \
            --eval "(setq package-user-dir (expand-file-name \".cache/elpa\" default-directory))" \
            --eval "(package-initialize)" \
            -L elisp -l test/chatgpt-books-test.el -f ert-run-tests-batch-and-exit; rc=$?; echo "ert-exit=$rc"; ls -la .cache/org-roam.db; exit $rc'

      - name: Publish probe results
        if: always()
        run: |
          git config user.name "ci-probe"
          git config user.email "ci-probe@noreply.git.starintel.actor"
          git add probe-logs || true
          git commit -m "ci-probe: books-ci step logs" || true
          git push origin HEAD:refs/heads/ci-probe-results-${GITHUB_SHA:0:8} || echo "push failed"
