name: expert-systems-book

on:
  pull_request:
    paths:
      - 'books/expert-systems/**'
      - '.github/workflows/expert-systems-book.yml'
  workflow_dispatch:

jobs:
  engine-and-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Common Lisp and publication tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sbcl graphviz curl unzip default-jre-headless
          curl --fail --location --retry 3 \
            --output pandoc.deb \
            https://github.com/jgm/pandoc/releases/download/3.10.1/pandoc-3.10.1-1-amd64.deb
          sudo dpkg -i pandoc.deb
          curl --fail --location --retry 3 \
            --output epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          unzip -q epubcheck.zip -d .cache
          sbcl --version
          dot -V
          pandoc --version | head -1
          java -jar .cache/epubcheck-5.3.0/epubcheck.jar --version

      - name: Run inference-engine tests
        run: sbcl --script books/expert-systems/code/inference-engine/run-tests.lisp

      - name: Validate editable engine diagrams
        shell: bash
        run: |
          set -euo pipefail
          dot -Tsvg books/expert-systems/assets/matcher-join.dot -o /tmp/matcher-join.svg
          dot -Tsvg books/expert-systems/assets/agenda-cycle.dot -o /tmp/agenda-cycle.svg
          dot -Tsvg books/expert-systems/assets/rete-positive.dot -o /tmp/rete-positive.svg
          dot -Tsvg books/expert-systems/assets/truth-maintenance.dot -o /tmp/truth-maintenance.svg

      - name: Build Expert Systems book
        run: make book BOOK=expert-systems

      - name: Validate Expert Systems book
        env:
          EPUBCHECK_JAR: .cache/epubcheck-5.3.0/epubcheck.jar
        run: make check BOOK=expert-systems

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nix-bin
          sudo mkdir -p /etc/nix
          echo 'experimental-features = nix-command flakes' | sudo tee -a /etc/nix/nix.conf
          nix --version

      - name: Flake check
        run: sudo nix flake check -L
