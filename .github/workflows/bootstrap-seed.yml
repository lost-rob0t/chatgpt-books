name: bootstrap-seed

on:
  push:
    branches:
      - agent/bootstrap-org-books

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-org-books
          fetch-depth: 0

      - name: Reconstruct validated generator
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/gen-00.b64 \
            .bootstrap/gen-01.b64 \
            .bootstrap/gen-02a.b64 \
            .bootstrap/gen-02b.b64 \
            .bootstrap/gen-03.b64 \
            | base64 --decode > /tmp/gen-books.py.xz
          xz --decompress --stdout /tmp/gen-books.py.xz > /tmp/gen-books.py
          actual="$(sha256sum /tmp/gen-books.py | cut -d' ' -f1)"
          expected="a4c5df8c55f1346c306e1ccb33c61576f04e79dafc7ac1c861bdf4fa4df3c02f"
          test "$actual" = "$expected"

      - name: Expand source tree
        run: python3 /tmp/gen-books.py

      - name: Verify generated structure
        run: ./tools/check-structure

      - name: Remove one-shot bootstrap machinery
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-seed.yml

      - name: Commit bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: bootstrap org-mode technical book publishing system'
          git push origin HEAD:agent/bootstrap-org-books
