name: starintel-book

on:
  pull_request:
    paths:
      - 'books/starintel/**'
      - '.github/workflows/starintel-book.yml'
  workflow_dispatch:

jobs:
  records-and-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install publication and diagram tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git graphviz python3-pip curl unzip default-jre-headless
          curl --fail --location --retry 3 \
            --output pandoc.deb \
            https://github.com/jgm/pandoc/releases/download/3.10.1/pandoc-3.10.1-1-amd64.deb
          sudo dpkg -i pandoc.deb
          curl --fail --location --retry 3 \
            --output epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          unzip -q epubcheck.zip -d .cache
          python3 --version
          dot -V
          pandoc --version | head -1
          java -jar .cache/epubcheck-5.3.0/epubcheck.jar --version

      - name: Fetch pinned StarIntel document adapter and schema
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .cache/starintel-doc
          git -C .cache/starintel-doc init
          git -C .cache/starintel-doc remote add origin https://github.com/lost-rob0t/starintel-doc.git
          git -C .cache/starintel-doc fetch --depth=1 origin 5857914a1e34ad18a6956b8ff0df5349de0ca099
          git -C .cache/starintel-doc checkout --detach FETCH_HEAD
          test "$(git -C .cache/starintel-doc rev-parse HEAD)" = "5857914a1e34ad18a6956b8ff0df5349de0ca099"

          mkdir -p .cache/starintel-schema/schemas
          curl --fail --location --retry 3 \
            --output .cache/starintel-schema/schemas/starintel-doc-v0.9.0.schema.json \
            https://raw.githubusercontent.com/lost-rob0t/starintel-gpt-auto-dig/6479c0a9dc88ce9fed183515fc4df5d245de0b3a/schemas/starintel-doc-v0.9.0.schema.json
          test -s .cache/starintel-schema/schemas/starintel-doc-v0.9.0.schema.json

          python3 -m pip install .cache/starintel-doc

      - name: Run Project 1 record-contract tests
        run: bash books/starintel/code/records/run-tests

      - name: Run canonical Project 1 SDK practicum
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install 'jsonschema[format]==4.26.0'
          git clone https://github.com/lost-rob0t/starintel-doc .cache/starintel-doc-canonical
          git -C .cache/starintel-doc-canonical checkout 6aa8051dc7ea560943a60a25e1d600467f2778bc
          bash books/starintel/code/canonical-records/run-tests .cache/starintel-doc-canonical
          python3 -m py_compile books/starintel/code/canonical-records/*.py

      - name: Run Project 2 ingest-adapter tests
        run: |
          bash books/starintel/code/ingest-adapter/run-tests
          python3 -m py_compile \
            books/starintel/code/ingest-adapter/adapter.py \
            books/starintel/code/ingest-adapter/test_adapter.py

      - name: Run service-trace evidence tests
        run: |
          bash books/starintel/code/live-stack/run-tests
          python3 -m py_compile \
            books/starintel/code/live-stack/inject_probe.py \
            books/starintel/code/live-stack/summarize_trace.py \
            books/starintel/code/live-stack/test_trace.py
          bash -n books/starintel/code/live-stack/probe.sh
          bash -n books/starintel/code/live-stack/run-service-trace

      - name: Run ambiguous-bulk failure-analysis lab
        run: |
          bash books/starintel/code/ambiguous-bulk/run-tests
          python3 -m py_compile \
            books/starintel/code/ambiguous-bulk/reconcile.py \
            books/starintel/code/ambiguous-bulk/test_reconcile.py

      - name: Run bulk-job lifetime evidence lab
        run: |
          bash books/starintel/code/bulk-job-lifetime/run-tests
          python3 -m py_compile \
            books/starintel/code/bulk-job-lifetime/audit.py \
            books/starintel/code/bulk-job-lifetime/test_audit.py

      - name: Run Project 3 actor-injector tests
        run: |
          python3 -m unittest discover \
            -s books/starintel/code/actor-runtime \
            -p 'test_*.py' -v
          python3 -m py_compile \
            books/starintel/code/actor-runtime/inject_upstream_test.py \
            books/starintel/code/actor-runtime/test_injector.py
          bash -n books/starintel/code/actor-runtime/run-pinned-tests

      - name: Validate editable diagram sources
        run: |
          dot -Tsvg books/starintel/assets/document-flow.dot -o /tmp/starintel-document-flow.svg
          dot -Tsvg books/starintel/assets/ingest-settlement.dot -o /tmp/starintel-ingest-settlement.svg
          dot -Tsvg books/starintel/assets/actor-dispatch.dot -o /tmp/starintel-actor-dispatch.svg
          dot -Tsvg books/starintel/assets/canonical-record-evidence.dot -o /tmp/starintel-canonical-record-evidence.svg

      - name: Build StarIntel book
        run: make book BOOK=starintel

      - name: Validate StarIntel book
        env:
          EPUBCHECK_JAR: .cache/epubcheck-5.3.0/epubcheck.jar
        run: make check BOOK=starintel

      - name: Upload validated StarIntel EPUB
        uses: actions/upload-artifact@v4
        with:
          name: starintel-book-epub
          path: books/starintel/dist/starintel.epub
          if-no-files-found: error

  actor-runtime-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Fetch exact StarIntel Server actor-runtime pin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/starintel-server
          git -C .cache/starintel-server init
          git -C .cache/starintel-server remote add origin https://github.com/lost-rob0t/starintel-server.git
          git -C .cache/starintel-server fetch --depth=1 origin 1ac298b797bd4bc0e71cfde083c6a59af55ccc6f
          git -C .cache/starintel-server checkout --detach FETCH_HEAD
          test "$(git -C .cache/starintel-server rev-parse HEAD)" = \
            "1ac298b797bd4bc0e71cfde083c6a59af55ccc6f"

      - name: Run Project 3 inside pinned upstream StarIntel/Sento unit suite
        run: bash books/starintel/code/actor-runtime/run-pinned-tests .cache/starintel-server

  service-backed-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install service-trace prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq
          python3 --version
          docker --version
          docker compose version

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run pinned disposable StarIntel service trace
        run: bash books/starintel/code/live-stack/run-service-trace

      - name: Validate sanitized trace artifact
        run: |
          test -s .cache/starintel-service-trace.json
          python3 -m json.tool .cache/starintel-service-trace.json >/dev/null
          jq -e '.schema == "starintel-book-service-trace-v1" and .claim_status == "TESTED"' \
            .cache/starintel-service-trace.json >/dev/null

      - name: Upload sanitized service trace
        uses: actions/upload-artifact@v4
        with:
          name: starintel-service-trace
          path: .cache/starintel-service-trace.json
          if-no-files-found: error

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Nix
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nix-bin
          sudo mkdir -p /etc/nix
          echo 'experimental-features = nix-command flakes' | sudo tee -a /etc/nix/nix.conf
          nix --version

      - name: Flake check
        run: sudo nix flake check -L

