name: erlang-book

on:
  pull_request:
    paths:
      - 'books/erlang/**'
      - '.github/workflows/erlang-book.yml'
  workflow_dispatch:

jobs:
  erlang-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: '29.1'
          version-type: strict

      - name: Install publication tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y graphviz curl unzip default-jre-headless
          curl --fail --location --retry 3 \
            --output pandoc.deb \
            https://github.com/jgm/pandoc/releases/download/3.10.1/pandoc-3.10.1-1-amd64.deb
          sudo dpkg -i pandoc.deb
          curl --fail --location --retry 3 \
            --output epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          unzip -q epubcheck.zip -d .cache
          erl -noshell -eval 'io:format("OTP ~s~n", [erlang:system_info(otp_release)]), halt().'
          pandoc --version | head -1
          java -jar .cache/epubcheck-5.3.0/epubcheck.jar --version

      - name: Run Erlang foundations tests
        run: bash ./books/erlang/code/foundations/run-tests.sh

      - name: Run OTP worker application tests
        run: bash ./books/erlang/code/otp-worker/run-tests.sh

      - name: Run release construction and boot tests
        run: bash ./books/erlang/code/release-lab/run-tests.sh

      - name: Validate Chapter 13 lifecycle diagram source
        shell: bash
        run: |
          set -euo pipefail
          test -s books/erlang/assets/otp-application-lifecycle.dot
          test -s books/erlang/assets/otp-application-lifecycle.svg
          dot -Tsvg books/erlang/assets/otp-application-lifecycle.dot > /tmp/otp-application-lifecycle.svg
          grep -q 'application_controller' /tmp/otp-application-lifecycle.svg
          grep -q 'otp_worker_sup' /tmp/otp-application-lifecycle.svg
          grep -q 'otp_worker' /tmp/otp-application-lifecycle.svg

      - name: Validate Chapter 14 release diagram source
        shell: bash
        run: |
          set -euo pipefail
          test -s books/erlang/assets/release-boot-flow.dot
          test -s books/erlang/assets/release-boot-flow.svg
          dot -Tsvg books/erlang/assets/release-boot-flow.dot > /tmp/release-boot-flow.svg
          grep -q 'systools:make_script/2' /tmp/release-boot-flow.svg
          grep -q 'otp_worker_release.rel' /tmp/release-boot-flow.svg
          grep -q 'otp_worker_sup' /tmp/release-boot-flow.svg

      - name: Build Erlang book
        run: make book BOOK=erlang

      - name: Validate Erlang book
        env:
          EPUBCHECK_JAR: ${{ github.workspace }}/.cache/epubcheck-5.3.0/epubcheck.jar
        run: make check BOOK=erlang

  nix-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate repository flake
        run: nix flake check -L
