name: private-book-build

on:
  workflow_dispatch:
    inputs:
      book:
        description: Book slug
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install publication tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y graphviz python3-matplotlib curl unzip default-jre-headless
          curl --fail --location --retry 3 \
            --output pandoc.deb \
            https://github.com/jgm/pandoc/releases/download/3.10.1/pandoc-3.10.1-1-amd64.deb
          sudo dpkg -i pandoc.deb
          curl --fail --location --retry 3 \
            --output epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          unzip -q epubcheck.zip -d .cache

      - name: Build and validate private EPUB
        env:
          EPUBCHECK_JAR: .cache/epubcheck-5.3.0/epubcheck.jar
        run: make check BOOK="${{ inputs.book }}"

      - uses: actions/upload-artifact@v4
        if: github.server_url == 'https://github.com'
        with:
          name: "${{ inputs.book }}-epub"
          path: "books/${{ inputs.book }}/dist/${{ inputs.book }}.epub"

      - name: Publish book EPUB artifact (Forgejo)
        if: always() && github.server_url != 'https://github.com'
        run: tools/publish-ci-artifacts "books/${{ inputs.book }}/dist/${{ inputs.book }}.epub"
