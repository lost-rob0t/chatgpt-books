name: symbolic-ai-common-lisp

on:
  pull_request:
    paths:
      - "books/symbolic-ai-common-lisp/**"
      - ".github/workflows/symbolic-ai-common-lisp.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Common Lisp and publication tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sbcl graphviz curl unzip default-jre-headless
          curl --fail --location --retry 3 \
            --output pandoc.deb \
            https://github.com/jgm/pandoc/releases/download/3.10.1/pandoc-3.10.1-1-amd64.deb
          sudo dpkg -i pandoc.deb
          curl --fail --location --retry 3 \
            --output epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          unzip -q epubcheck.zip -d .cache
          sbcl --version
          pandoc --version | head -1
          java -jar .cache/epubcheck-5.3.0/epubcheck.jar --version

      - name: Search Library executable tests
        run: sbcl --script books/symbolic-ai-common-lisp/code/search/run-tests.lisp

      - name: Search Library ASDF test operation
        shell: bash
        run: |
          set -euo pipefail
          sbcl --noinform --non-interactive \
            --eval '(require :asdf)' \
            --eval '(asdf:load-asd (truename "books/symbolic-ai-common-lisp/code/search/symbolic-ai-search.asd"))' \
            --eval '(asdf:test-system "symbolic-ai-search/tests")'

      - name: Repository structural validation
        run: ./tools/check-structure

      - name: Build and validate Symbolic AI in Common Lisp
        env:
          EPUBCHECK_JAR: .cache/epubcheck-5.3.0/epubcheck.jar
        run: make check BOOK=symbolic-ai-common-lisp
