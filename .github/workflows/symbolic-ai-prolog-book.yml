name: symbolic-ai-prolog-book

on:
  pull_request:
    paths:
      - 'books/symbolic-ai-prolog/**'
      - '.github/workflows/symbolic-ai-prolog-book.yml'
  workflow_dispatch:

jobs:
  prolog-and-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install current stable SWI-Prolog and publication tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common graphviz python3-matplotlib curl unzip default-jre-headless
          sudo apt-add-repository -y ppa:swi-prolog/stable
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox
          curl --fail --location --retry 3 \
            --output pandoc.deb \
            https://github.com/jgm/pandoc/releases/download/3.10.1/pandoc-3.10.1-1-amd64.deb
          sudo dpkg -i pandoc.deb
          curl --fail --location --retry 3 \
            --output epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          unzip -q epubcheck.zip -d .cache
          swipl --version
          pandoc --version | head -1
          java -jar .cache/epubcheck-5.3.0/epubcheck.jar --version

      - name: Run Symbolic AI Prolog tests
        run: bash books/symbolic-ai-prolog/code/run-tests

      - name: Build Symbolic AI Prolog book
        run: make book BOOK=symbolic-ai-prolog

      - name: Validate Symbolic AI Prolog book
        env:
          EPUBCHECK_JAR: .cache/epubcheck-5.3.0/epubcheck.jar
        run: make check BOOK=symbolic-ai-prolog

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nix-bin
          sudo mkdir -p /etc/nix
          echo 'experimental-features = nix-command flakes' | sudo tee -a /etc/nix/nix.conf
          nix --version

      - name: Flake check
        run: sudo nix flake check -L
