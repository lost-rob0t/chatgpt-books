name: lfe-book

on:
  pull_request:
    paths:
      - 'books/lfe/**'
      - '.github/workflows/lfe-book.yml'
  workflow_dispatch:

jobs:
  lfe-and-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang and publication tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential git erlang-nox erlang-dev graphviz python3-matplotlib curl unzip default-jre-headless
          curl --fail --location --retry 3 \
            --output pandoc.deb \
            https://github.com/jgm/pandoc/releases/download/3.10.1/pandoc-3.10.1-1-amd64.deb
          sudo dpkg -i pandoc.deb
          curl --fail --location --retry 3 \
            --output epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          unzip -q epubcheck.zip -d .cache
          erl -noshell -eval 'io:format("OTP ~s~n", [erlang:system_info(otp_release)]), halt().'
          test -f "$(erl -noshell -eval 'io:format("~s", [code:lib_dir(eunit, include)]), halt().' 2>/dev/null)/eunit.hrl"
          erl -noshell -eval 'case code:ensure_loaded(peer) of {module,peer} -> halt(0); Other -> io:format("peer unavailable: ~p~n", [Other]), halt(1) end.'
          erl -noshell -eval 'case code:ensure_loaded(ct) of {module,ct} -> halt(0); Other -> io:format("Common Test unavailable: ~p~n", [Other]), halt(1) end.'
          pandoc --version | head -1
          java -jar .cache/epubcheck-5.3.0/epubcheck.jar --version

      - name: Build pinned LFE v2.2.2
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.2.2 https://github.com/lfe/lfe.git .cache/lfe
          make -C .cache/lfe compile
          echo "$GITHUB_WORKSPACE/.cache/lfe/bin" >> "$GITHUB_PATH"

      - name: Run Project 1 LFE examples and Erlang interoperability smoke
        run: bash books/lfe/code/event-rules/run-tests

      - name: Run Project 2 actor and message regressions
        run: bash books/lfe/code/actor-router/run-tests

      - name: Run Project 3 OTP service and supervision regressions
        run: bash books/lfe/code/otp-router/run-tests

      - name: Run Project 4 distributed Common Test regressions
        run: bash books/lfe/code/distributed-router/run-tests

      - name: Validate LFE teaching diagrams
        shell: bash
        run: |
          set -euo pipefail
          dot -Tsvg books/lfe/assets/event-routing.dot >/dev/null
          dot -Tsvg books/lfe/assets/macro-expansion.dot >/dev/null
          dot -Tsvg books/lfe/assets/actor-protocol.dot >/dev/null
          dot -Tsvg books/lfe/assets/otp-supervision.dot >/dev/null
          dot -Tsvg books/lfe/assets/testing-layers.dot >/dev/null
          dot -Tsvg books/lfe/assets/release-boot.dot >/dev/null
          dot -Tsvg books/lfe/assets/distribution-boundary.dot >/dev/null

      - name: Build LFE book
        run: make book BOOK=lfe

      - name: Validate LFE book
        env:
          EPUBCHECK_JAR: .cache/epubcheck-5.3.0/epubcheck.jar
        run: make check BOOK=lfe

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nix-bin
          sudo mkdir -p /etc/nix
          echo 'experimental-features = nix-command flakes' | sudo tee -a /etc/nix/nix.conf
          nix --version

      - name: Flake check
        run: sudo nix flake check -L
