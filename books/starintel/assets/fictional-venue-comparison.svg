<text x="450" y="58" font-size="15" text-anchor="middle">Compare feature combinations. Capture time remains unknown.</text>
<text x="230" y="98" font-size="21" text-anchor="middle">Beacon Hall</text>
<text x="670" y="98" font-size="21" text-anchor="middle">Lantern Library</text>
</g>
