<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-labelledby="title desc">
<title id="title">A matrix transforms basis vectors and the unit square</title>
<desc id="desc">The original unit square and basis vectors are shown with dashed outlines. Applying matrix A sends the basis to the columns of A and the square to a parallelogram, shown with solid outlines.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g color="#111" font-family="sans-serif">
<text x="430" y="35" text-anchor="middle" font-size="22">A maps basis vectors to its columns</text>
<text x="430" y="62" text-anchor="middle" font-size="16">A = [[1, 0.5], [0.25, 1]]</text>
<line x1="63.000" y1="245.000" x2="777.000" y2="245.000" stroke="currentColor" stroke-width="1"/>
<line x1="420.000" y1="423.500" x2="420.000" y2="66.500" stroke="currentColor" stroke-width="1"/>
<polygon points="420.000,245.000 525.000,245.000 525.000,140.000 420.000,140.000" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="7 6"/>
<polygon points="420.000,245.000 525.000,218.750 577.500,113.750 472.500,140.000" fill="none" stroke="currentColor" stroke-width="4"/>
<line x1="420.000" y1="245.000" x2="525.000" y2="245.000" stroke="currentColor" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<line x1="420.000" y1="245.000" x2="420.000" y2="140.000" stroke="currentColor" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<line x1="420.000" y1="245.000" x2="525.000" y2="218.750" stroke="currentColor" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="420.000" y1="245.000" x2="472.500" y2="140.000" stroke="currentColor" stroke-width="4" marker-end="url(#arrow)"/>
<text x="548" y="259" font-size="17">e₁</text>
<text x="430" y="126" font-size="17">e₂</text>
<text x="536" y="204" font-size="17">Ae₁ = column 1</text>
<text x="493" y="120" font-size="17">Ae₂ = column 2</text>
<text x="70" y="395" font-size="16">dashed: input geometry</text>
<text x="70" y="420" font-size="16">solid: transformed geometry</text>
</g>
</svg>
