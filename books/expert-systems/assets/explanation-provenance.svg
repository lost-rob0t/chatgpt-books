<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Current explanation graph from exact support identities</title>
  <desc id="desc">A derived fact points to a justification, which uses derived and evidence facts. A contradiction node points to two counterevidence fact occurrences.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)">
    <path d="M250 105 H390"/>
    <path d="M610 105 H745"/>
    <path d="M850 145 V235"/>
    <path d="M850 305 V395"/>
    <path d="M570 350 H735"/>
    <path d="M570 350 H735" transform="translate(0 90)"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="currentColor" text-anchor="middle">
    <rect x="30" y="55" width="220" height="100" fill="white" stroke="currentColor"/>
    <text x="140" y="82"><tspan x="140">fact occurrence</tspan><tspan x="140" dy="22">needs-investigation(frontend)</tspan><tspan x="140" dy="22">:derived</tspan></text>
    <text x="320" y="94">supported-by</text>

    <rect x="390" y="55" width="220" height="100" fill="white" stroke="currentColor"/>
    <text x="500" y="88"><tspan x="500">justification</tspan><tspan x="500" dy="22">rule.investigate-...</tspan></text>
    <text x="678" y="94">uses</text>

    <rect x="745" y="55" width="220" height="100" fill="white" stroke="currentColor"/>
    <text x="855" y="82"><tspan x="855">fact occurrence</tspan><tspan x="855" dy="22">dependency-impact</tspan><tspan x="855" dy="22">:derived</tspan></text>

    <rect x="745" y="235" width="220" height="70" fill="white" stroke="currentColor"/>
    <text x="855" y="265"><tspan x="855">justification</tspan><tspan x="855" dy="22">rule.dependency-impact</tspan></text>
    <text x="910" y="200">supported-by</text>

    <rect x="745" y="395" width="220" height="70" fill="white" stroke="currentColor"/>
    <text x="855" y="425"><tspan x="855">evidence occurrence</tspan><tspan x="855" dy="22">service-state(api, failed)</tspan></text>
    <text x="900" y="355">uses / grounded-by</text>

    <polygon points="360,305 460,350 360,395 260,350" fill="white" stroke="currentColor"/>
    <text x="360" y="340"><tspan x="360">contradiction</tspan><tspan x="360" dy="22">spec + provenance</tspan></text>

    <rect x="735" y="315" width="210" height="70" fill="white" stroke="currentColor"/>
    <text x="840" y="345"><tspan x="840">active @ epoch 42</tspan><tspan x="840" dy="22">:evidence</tspan></text>
    <rect x="735" y="405" width="210" height="70" fill="white" stroke="currentColor"/>
    <text x="840" y="435"><tspan x="840">failed @ epoch 42</tspan><tspan x="840" dy="22">:assumption</tspan></text>
    <text x="650" y="337">counterevidence</text>
    <text x="650" y="427">counterevidence</text>
  </g>
</svg>
