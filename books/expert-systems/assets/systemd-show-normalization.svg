<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Machine-facing systemd evidence normalization</title>
  <desc id="desc">Captured systemctl show text passes syntax and required-property validation, becomes provenance-bearing facts, preserves unit-local InvocationID separately from caller activation context, derives failed activation only from ActiveState failed, then joins source-backed dependency rules and explanation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
  </defs>
  <g font-family="sans-serif" font-size="16" fill="none" stroke="currentColor" stroke-width="2">
    <text x="600" y="30" text-anchor="middle" fill="currentColor" font-size="20">Project 2 milestone B: machine-facing systemd evidence boundary</text>
    <rect x="30" y="80" width="190" height="70" rx="6"/><text x="125" y="108" text-anchor="middle" fill="currentColor">captured systemctl show</text><text x="125" y="132" text-anchor="middle" fill="currentColor">KEY=VALUE text</text>
    <rect x="275" y="80" width="180" height="70" rx="6"/><text x="365" y="108" text-anchor="middle" fill="currentColor">first '=' parser</text><text x="365" y="132" text-anchor="middle" fill="currentColor">no shell execution</text>
    <rect x="510" y="80" width="220" height="70" rx="6"/><text x="620" y="108" text-anchor="middle" fill="currentColor">required-property gate</text><text x="620" y="132" text-anchor="middle" fill="currentColor">unique keys + expected Id</text>
    <polygon points="805,75 1015,75 1040,115 1015,155 805,155 780,115"/><text x="910" y="108" text-anchor="middle" fill="currentColor">reject capture</text><text x="910" y="132" text-anchor="middle" fill="currentColor">malformed / missing / mismatch</text>
    <rect x="510" y="220" width="220" height="70" rx="6"/><text x="620" y="249" text-anchor="middle" fill="currentColor">provenance-bearing</text><text x="620" y="273" text-anchor="middle" fill="currentColor">normalized facts</text>
    <rect x="50" y="365" width="220" height="70" rx="6"/><text x="160" y="394" text-anchor="middle" fill="currentColor">unit-local InvocationID</text><text x="160" y="418" text-anchor="middle" fill="currentColor">kept as identity</text>
    <rect x="330" y="365" width="230" height="70" rx="6"/><text x="445" y="394" text-anchor="middle" fill="currentColor">caller activation context</text><text x="445" y="418" text-anchor="middle" fill="currentColor">+ configuration generation</text>
    <rect x="620" y="350" width="230" height="100" rx="6"/><text x="735" y="380" text-anchor="middle" fill="currentColor">ActiveState / SubState</text><text x="735" y="404" text-anchor="middle" fill="currentColor">Result / main-exit evidence</text><text x="735" y="428" text-anchor="middle" fill="currentColor">raw values preserved</text>
    <rect x="930" y="300" width="230" height="70" rx="6"/><text x="1045" y="329" text-anchor="middle" fill="currentColor">activation-outcome :failed</text><text x="1045" y="353" text-anchor="middle" fill="currentColor">only ActiveState=failed</text>
    <path d="M 930 420 L 1160 420 L 1160 500 L 930 500 Z"/><text x="1045" y="452" text-anchor="middle" fill="currentColor">ExecMainStatus != 0</text><text x="1045" y="476" text-anchor="middle" fill="currentColor">is NOT a failure rule</text>
    <rect x="160" y="570" width="200" height="70" rx="6"/><text x="260" y="599" text-anchor="middle" fill="currentColor">Requires + After</text><text x="260" y="623" text-anchor="middle" fill="currentColor">configuration facts</text>
    <rect x="470" y="570" width="210" height="70" rx="6"/><text x="575" y="599" text-anchor="middle" fill="currentColor">source-backed</text><text x="575" y="623" text-anchor="middle" fill="currentColor">dependency rule</text>
    <rect x="760" y="570" width="190" height="70" rx="6"/><text x="855" y="599" text-anchor="middle" fill="currentColor">bounded diagnostic</text><text x="855" y="623" text-anchor="middle" fill="currentColor">hypothesis</text>
    <rect x="990" y="570" width="190" height="70" rx="6"/><text x="1085" y="599" text-anchor="middle" fill="currentColor">exact-support</text><text x="1085" y="623" text-anchor="middle" fill="currentColor">explanation graph</text>
    <g marker-end="url(#arrow)">
      <line x1="220" y1="115" x2="275" y2="115"/><line x1="455" y1="115" x2="510" y2="115"/><line x1="730" y1="115" x2="780" y2="115"/>
      <line x1="620" y1="150" x2="620" y2="220"/><line x1="560" y1="290" x2="200" y2="365"/><line x1="610" y1="290" x2="470" y2="365"/><line x1="680" y1="290" x2="720" y2="350"/>
      <line x1="850" y1="380" x2="930" y2="345"/><line x1="850" y1="420" x2="930" y2="460"/>
      <line x1="445" y1="435" x2="550" y2="570"/><line x1="1045" y1="370" x2="620" y2="570"/><line x1="360" y1="605" x2="470" y2="605"/>
      <line x1="680" y1="605" x2="760" y2="605"/><line x1="950" y1="605" x2="990" y2="605"/>
    </g>
  </g>
</svg>
